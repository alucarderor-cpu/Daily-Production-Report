<style>
/* Layout: ورقة تشغيل مصنع. شريط أدوات التاريخ، مؤشرات، رسم الإنتاج، جدول الورديات، جدول العطلات، ثم فورم التسجيل. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#18203a; --muted:#5d6579; --line:#dde0e8; --head:#1d2a4d; --head-ink:#ffffff;
  --accent:#1f5fbf; --accent-ink:#ffffff;
  --s1:#3b6fb6; --s2:#d98a1f; --s3:#2a9488;
  --good:#17803d; --good-bg:#e2f3e7; --warn:#a35b00; --warn-bg:#fdf0d8; --bad:#b4281f; --bad-bg:#fbe5e2;
  --field:#f8f9fb;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --surface:#171e33; --ink:#e8ebf4; --muted:#9aa3bb; --line:#2a3350; --head:#223163; --head-ink:#f2f4fb;
  --accent:#6ba3ff; --accent-ink:#0b1328;
  --s1:#6f9fe0; --s2:#e8a64a; --s3:#4cc0b2;
  --good:#6fd08f; --good-bg:#16301f; --warn:#f0b35a; --warn-bg:#35280f; --bad:#ff8f86; --bad-bg:#3a1a18;
  --field:#10172b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --surface:#171e33; --ink:#e8ebf4; --muted:#9aa3bb; --line:#2a3350; --head:#223163; --head-ink:#f2f4fb;
  --accent:#6ba3ff; --accent-ink:#0b1328;
  --s1:#6f9fe0; --s2:#e8a64a; --s3:#4cc0b2;
  --good:#6fd08f; --good-bg:#16301f; --warn:#f0b35a; --warn-bg:#35280f; --bad:#ff8f86; --bad-bg:#3a1a18;
  --field:#10172b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{background:var(--head);color:var(--head-ink);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:700;text-wrap:balance}
.sub{margin:2px 0 0;font-size:13px;opacity:.8}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.datebar label{font-size:13px;opacity:.85}
button,input,select,textarea{font:inherit;color:inherit}
.dbtn{background:rgba(255,255,255,.12);color:var(--head-ink);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:40px}
.dbtn:hover{background:rgba(255,255,255,.22)}
.datebar input[type=date]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:40px;font-family:var(--mono);direction:ltr}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dayline{font-size:14px;margin-top:10px;max-width:1180px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .n{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card>h2{margin:0;padding:12px 16px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.card>h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--field);font-weight:600;font-size:13px;color:var(--muted)}
td.l,th.l{text-align:start;white-space:normal;min-width:150px}
tbody tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--field);border-top:2px solid var(--line)}
td.mac{font-weight:700;font-family:var(--mono)}
td.empty{color:var(--muted)}
.cellbtn{background:none;border:0;padding:2px 8px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums;min-width:34px}
.cellbtn:hover{background:var(--field);outline:1px solid var(--line)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;min-width:62px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{color:var(--muted)}
.chartbox{padding:8px 12px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 16px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;max-width:100%}
svg text{font-family:var(--font);fill:var(--muted);font-size:12px}
.note-cell{max-width:380px;white-space:normal;text-align:start}
.rowbtn{cursor:pointer}.rowbtn:hover td{background:var(--field)}
.noreason{color:var(--warn);font-weight:600}
.none{color:var(--muted)}
form{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:42px;width:100%}
.f.wide{grid-column:1/-1}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 20px;font-weight:600;cursor:pointer;min-height:42px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
#msg{font-size:14px;min-height:22px}
#msg.err{color:var(--bad)} #msg.ok{color:var(--good)}
.foot{font-size:12.5px;color:var(--muted);padding:0 2px}
@media (max-width:560px){h1{font-size:20px}.kpi .v{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top"><div class="top-in">
  <div><h1>تقرير الإنتاج اليومي</h1><p class="sub">إنتاج كل ماكينة وكل وردية، العطلات، وتسجيل الإنتاج الجديد</p></div>

      <div class="f"><label for="f-shift">الوردية</label><select id="f-shift" required><option value="1">الوردية 1</option><option value="2">الوردية 2</option><option value="3">الوردية 3</option></select></div>
      <div class="f"><label for="f-out">الإنتاج</label><input type="number" id="f-out" min="0" step="1" inputmode="numeric" required></div>
      <div class="f"><label for="f-weaver">النساج</label><input id="f-weaver" list="dl-weavers"></div>
      <div class="f"><label for="f-a1">المساعد الأول</label><input id="f-a1" list="dl-assist"></div>
      <div class="f"><label for="f-a2">المساعد الثاني</label><input id="f-a2" list="dl-assist"></div>
      <div class="f"><label for="f-reason">سبب العطلة</label><select id="f-reason"><option value="">بدون عطلة</option></select></div>
      <div class="f"><label for="f-dt">مدة التوقف (دقيقة)</label><input type="number" id="f-dt" min="0" step="1" inputmode="numeric" value="0"></div>
      <div class="f wide"><label for="f-note">تفاصيل / ملاحظات</label><textarea id="f-note" rows="2"></textarea></div>
      <datalist id="dl-weavers"></datalist><datalist id="dl-assist"></datalist>
      <div class="actions">
        <button class="btn" id="save" type="submit">حفظ</button>
        <button class="btn alt" id="clear" type="button">سجل جديد</button>
        <button class="btn danger" id="del" type="button" hidden>حذف هذا السجل</button>
        <button class="btn alt" id="exp" type="button" hidden>تنزيل التسجيلات الجديدة للإكسل</button>
        <span id="msg" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>
  <p class="foot" id="foot"></p>
</div>

<script>
(function(){
document.documentElement.lang='ar';document.documentElement.dir='rtl';
var SEED=JSON.parse(document.getElementById('seed').textContent);
var TARGET=SEED.targets, MACHINES=SEED.machines, DAYS=['الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد'];
var $=function(i){return document.getElementById(i)};
var base=new Map(), over=new Map(), dbc=null, canWrite=false, busy=false, cur='';
SEED.rows.forEach(function(r){base.set(r[0]+'_'+r[1]+'_'+r[2],{date:r[0],machine:r[1],shift:r[2],weaver:r[3],a1:r[4],a2:r[5],output:r[6],note:r[7],reason:r[8],dt:r[9]})});
var byDate=new Map(), lastDate='';
function key(d,m,s){return d+'_'+m+'_'+s}
function rebuild(){
  var merged=new Map(base);
  over.forEach(function(v,k){ if(v&&v.deleted) merged.delete(k); else if(v&&v.date) merged.set(k,{date:v.date,machine:+v.machine,shift:+v.shift,weaver:v.weaver||'',a1:v.a1||'',a2:v.a2||'',output:(v.output==null?null:+v.output),note:v.note||'',reason:v.reason||'',dt:+v.dt||0}); });
  byDate=new Map();
  merged.forEach(function(r){ if(!byDate.has(r.date)) byDate.set(r.date,[]); byDate.get(r.date).push(r); });
  lastDate=''; byDate.forEach(function(_,d){ if(d>lastDate) lastDate=d; });
  merged.forEach(function(_,k){});
  return merged;
}
var merged=rebuild();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shiftOf(rows,m,s){for(var i=0;i<rows.length;i++){if(rows[i].machine===m&&rows[i].shift===s)return rows[i]}return null}
function effPill(e,tg){ if(!tg) return '<span class="pill none">لا يوجد</span>'; var p=Math.round(e*1000)/10; var c=e>=0.85?'good':(e>=0.6?'warn':'bad'); return '<span class="pill '+c+'">'+p.toFixed(1)+'%</span>'; }
function dayName(d){ var t=new Date(d+'T00:00:00'); var w=(t.getDay()+6)%7; return DAYS[w]; }

function render(){
  var rows=byDate.get(cur)||[];
  $('dayname').textContent=cur? ('اليوم: '+dayName(cur)):'';
  // per machine data
  var per=MACHINES.map(function(m){
    var sh=[1,2,3].map(function(s){return shiftOf(rows,m,s)});
    var tot=0,tg=0,run=0;
    sh.forEach(function(r,i){ if(r){ var o=r.output||0; tot+=o; tg+=TARGET[i+1]; if(o>0) run++; } });
    return {m:m,sh:sh,tot:tot,tg:tg,run:run};
  });
  var total=per.reduce(function(a,p){return a+p.tot},0), target=per.reduce(function(a,p){return a+p.tg},0);
  var active=per.filter(function(p){return p.tot>0}).length;
  var stops=rows.filter(function(r){return r.reason||r.note||r.dt>0}).length;
  var eff=target?total/target:0;
  var kp=[['إجمالي إنتاج اليوم',total,'قطعة'],['الإنتاج المستهدف',target,'حسب الورديات المسجلة'],['كفاءة اليوم',target?(Math.round(eff*1000)/10).toFixed(1)+'%':'—','الإنتاج ÷ المستهدف'],['ماكينات شغالة',active+' من '+MACHINES.length,'سجلت إنتاج'],['ورديات فيها عطلة',stops,'من '+rows.length+' وردية مسجلة']];
  $('kpis').innerHTML=kp.map(function(k){return '<div class="kpi"><div class="l">'+k[0]+'</div><div class="v">'+esc(k[1])+'</div><div class="n">'+k[2]+'</div></div>'}).join('');
  drawChart(per);
  // production table
  var h='<thead><tr><th>الماكينة</th><th>وردية 1</th><th>وردية 2</th><th>وردية 3</th><th>الإجمالي</th><th>المستهدف</th><th>% الكفاءة</th><th>ورديات شغالة</th></tr></thead><tbody>';
  per.forEach(function(p){
    h+='<tr><td class="mac">'+p.m+'</td>';
    p.sh.forEach(function(r,i){
      var s=i+1;
      h+='<td'+(r?'':' class="empty"')+'><button class="cellbtn" type="button" data-m="'+p.m+'" data-s="'+s+'" title="'+(r?'تعديل':'تسجيل')+' وردية '+s+' ماكينة '+p.m+'">'+(r?(r.output==null?'—':r.output):'—')+'</button></td>';
    });
    h+='<td><b>'+p.tot+'</b></td><td>'+(p.tg||'—')+'</td><td>'+effPill(p.tg?p.tot/p.tg:0,p.tg)+'</td><td>'+p.run+'</td></tr>';
  });
  var tr=[1,2,3].map(function(s){return per.reduce(function(a,p){var r=p.sh[s-1];return a+(r&&r.output||0)},0)});
  h+='<tr class="tot"><td>الإجمالي</td><td>'+tr[0]+'</td><td>'+tr[1]+'</td><td>'+tr[2]+'</td><td>'+total+'</td><td>'+target+'</td><td>'+effPill(eff,target)+'</td><td></td></tr></tbody>';
  $('prod').innerHTML=h;
  // downtime table: all recorded shifts of the day
  var sorted=rows.slice().sort(function(a,b){return a.machine-b.machine||a.shift-b.shift});
  $('dtcount').textContent=sorted.length+' وردية مسجلة';
  var d='<thead><tr><th>الماكينة</th><th>الوردية</th><th class="l">النساج</th><th>الإنتاج</th><th>سبب العطلة</th><th class="l">تفاصيل / ملاحظات</th><th>مدة التوقف (دقيقة)</th></tr></thead><tbody>';
  if(!sorted.length) d+='<tr><td colspan="7" class="none">مفيش ورديات مسجلة في اليوم ده. سجل أول وردية من الفورم تحت.</td></tr>';
  sorted.forEach(function(r){
    var has=r.reason||r.note||r.dt>0;
    var reason=r.reason?esc(r.reason):(has?'<span class="noreason">بدون سبب محدد</span>':'<span class="none">لا توجد عطلة</span>');
    d+='<tr class="rowbtn" tabindex="0" data-m="'+r.machine+'" data-s="'+r.shift+'"><td class="mac">'+r.machine+'</td><td>'+r.shift+'</td><td class="l">'+esc(r.weaver)+'</td><td>'+(r.output==null?'—':r.output)+'</td><td>'+reason+'</td><td class="note-cell">'+esc(r.note)+'</td><td>'+(r.dt||0)+'</td></tr>';
  });
  $('dt').innerHTML=d+'</tbody>';
}

function drawChart(per){
  var W=760,H=300,L=40,R=12,T=26,B=34, iw=W-L-R, ih=H-T-B;
  var mx=Math.max.apply(null,per.map(function(p){return Math.max(p.tot,p.tg)}).concat([10]));
  var step=[10,20,25,50,100].filter(function(s){return mx/s<=6})[0]||100; var top=Math.ceil(mx/step)*step;
  var y=function(v){return T+ih-(v/top)*ih};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="الإنتاج حسب الماكينة" direction="ltr" style="direction:ltr">';
  for(var g=0;g<=top;g+=step){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g+'</text>'; }
  var bw=iw/per.length, w=Math.min(46,bw*0.62);
  var cols=['var(--s1)','var(--s2)','var(--s3)'];
  per.forEach(function(p,i){
    var cx=L+bw*i+bw/2, acc=0;
    p.sh.forEach(function(r,k){ var o=r&&r.output||0; if(o>0){ var y1=y(acc+o), y0=y(acc); s+='<rect x="'+(cx-w/2)+'" y="'+y1+'" width="'+w+'" height="'+Math.max(0,y0-y1-1)+'" fill="'+cols[k]+'" rx="2"><title>ماكينة '+p.m+' وردية '+(k+1)+': '+o+'</title></rect>'; acc+=o; } });
    if(p.tg){ s+='<line x1="'+(cx-w/2-4)+'" x2="'+(cx+w/2+4)+'" y1="'+y(p.tg)+'" y2="'+y(p.tg)+'" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/>'; }
    s+='<text x="'+cx+'" y="'+(y(Math.max(p.tot,p.tg))-7)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+(p.tot||'')+'</text>';
    s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" style="fill:var(--ink)">'+p.m+'</text>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)"/></svg>';
  $('chart').innerHTML=s;
}
$('legend').innerHTML=[1,2,3].map(function(s){return '<span><i style="background:var(--s'+s+')"></i>وردية '+s+'</span>'}).join('')+'<span><i style="background:none;border-top:2px dashed var(--ink);height:0;border-radius:0;vertical-align:3px"></i>الإنتاج المستهدف</span>';

// form
var shiftNote=$('foot'); shiftNote.textContent='الهدف لكل وردية: وردية 1 = '+TARGET[1]+'، وردية 2 = '+TARGET[2]+'، وردية 3 = '+TARGET[3]+'. بيانات السجل اللي كانت في الإكسل محفوظة في الصفحة، وأي تسجيل جديد أو تعديل بيتحفظ في قاعدة البيانات المشتركة.';
$('f-mac').innerHTML=MACHINES.map(function(m){return '<option value="'+m+'">'+m+'</option>'}).join('');
var ws={},as={}; SEED.weavers.concat(Array.from(base.values()).map(function(r){return r.weaver})).forEach(function(x){if(x)ws[x]=1});
SEED.assistants.concat(Array.from(base.values()).map(function(r){return r.a1}),Array.from(base.values()).map(function(r){return r.a2})).forEach(function(x){if(x)as[x]=1});
$('dl-weavers').innerHTML=Object.keys(ws).map(function(x){return '<option value="'+esc(x)+'">'}).join('');
$('dl-assist').innerHTML=Object.keys(as).map(function(x){return '<option value="'+esc(x)+'">'}).join('');
$('f-reason').innerHTML='<option value="">بدون عطلة</option>'+SEED.reasons.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join('');

function setMsg(t,c){var m=$('msg');m.textContent=t||'';m.className=c||''}
function fill(){
  var d=$('f-date').value,m=+$('f-mac').value,s=+$('f-shift').value;
  var r=merged.get(key(d,m,s));
  $('del').hidden=!r; $('formmode').textContent=r?'تعديل سجل موجود':'سجل جديد';
  if(r){ $('f-out').value=r.output==null?'':r.output; $('f-weaver').value=r.weaver; $('f-a1').value=r.a1; $('f-a2').value=r.a2; $('f-reason').value=r.reason||''; $('f-dt').value=r.dt||0; $('f-note').value=r.note; }
  else { $('f-out').value=''; $('f-weaver').value=''; $('f-a1').value=''; $('f-a2').value=''; $('f-reason').value=''; $('f-dt').value=0; $('f-note').value=''; }
}
function openEntry(m,s,scroll){ $('f-date').value=cur; $('f-mac').value=m; $('f-shift').value=s; fill(); setMsg(''); if(scroll) $('formcard').scrollIntoView({behavior:'smooth',block:'start'}); }
['f-date','f-mac','f-shift'].forEach(function(i){$(i).addEventListener('change',function(){fill();setMsg('')})});
$('clear').addEventListener('click',function(){ $('f-out').value='';$('f-weaver').value='';$('f-a1').value='';$('f-a2').value='';$('f-reason').value='';$('f-dt').value=0;$('f-note').value='';$('del').hidden=true;$('formmode').textContent='سجل جديد';setMsg('') });
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.cellbtn'); if(b){ openEntry(+b.dataset.m,+b.dataset.s,true); return; }
  var tr=e.target.closest&&e.target.closest('tr.rowbtn'); if(tr){ openEntry(+tr.dataset.m,+tr.dataset.s,true); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('rowbtn')) openEntry(+e.target.dataset.m,+e.target.dataset.s,true); });

function guard(){ if(!dbc){ setMsg('التسجيل غير متاح دلوقتي. افتح الصفحة بحساب مسجل دخول.','err'); return false;} if(!canWrite){ setMsg('حسابك للعرض بس. التسجيل محتاج صلاحية مساهم أو أعلى.','err'); return false;} return true; }
function write(p){ busy=true; $('save').disabled=true; $('del').disabled=true; return p.then(function(){ setMsg('اتحفظ','ok'); },function(er){ if(er&&er.code==='invalid_argument'){canWrite=false;setMsg('حسابك مش مسموح له بالتسجيل. اطلب صلاحية مساهم.','err')} else setMsg('معرفتش أحفظ. جرب تاني بعد شوية.','err'); }).then(function(){busy=false;$('save').disabled=false;$('del').disabled=false}); }
$('form').addEventListener('submit',function(e){
  e.preventDefault(); if(busy||!guard()) return;
  var d=$('f-date').value,m=+$('f-mac').value,s=+$('f-shift').value,o=$('f-out').value;
  if(!d||o===''){ setMsg('اكتب التاريخ والإنتاج','err'); return; }
  var doc={date:d,machine:m,shift:s,output:+o,weaver:$('f-weaver').value.trim(),a1:$('f-a1').value.trim(),a2:$('f-a2').value.trim(),reason:$('f-reason').value,dt:+$('f-dt').value||0,note:$('f-note').value.trim()};
  write(dbc.doc('entries/'+key(d,m,s)).set(doc)).then(function(){ if(d!==cur){ cur=d; $('day').value=d; render(); } });
});
$('del').addEventListener('click',function(){
  if(busy||!guard()) return; var d=$('f-date').value,m=+$('f-mac').value,s=+$('f-shift').value;
  write(dbc.doc('entries/'+key(d,m,s)).set({date:d,machine:m,shift:s,deleted:true})).then(function(){ $('clear').click(); });
});

// day navigation
function dates(){var a=[];byDate.forEach(function(_,d){a.push(d)});return a.sort()}
function go(d){ if(!d) return; cur=d; $('day').value=d; render(); if(!$('formcard').contains(document.activeElement)){ $('f-date').value=d; fill(); } }
$('day').addEventListener('change',function(){go($('day').value)});
$('last').addEventListener('click',function(){go(lastDate)});
function shiftDay(n){ var t=new Date(cur+'T00:00:00'); t.setDate(t.getDate()+n); go(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')); }
$('prev').addEventListener('click',function(){shiftDay(-1)});
$('next').addEventListener('click',function(){shiftDay(1)});

cur=lastDate; $('day').value=cur; $('f-date').value=cur; fill(); render();


// export new entries (not yet in the Excel log) as CSV, same column order as سجل الإنتاج
var dl=null;
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$('exp').addEventListener('click',function(){
  var list=[]; over.forEach(function(v,k){ if(v&&v.date&&!v.deleted) list.push(v) });
  if(!list.length){ setMsg('مفيش تسجيلات جديدة تتنزل','err'); return; }
  list.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.machine-b.machine||a.shift-b.shift)});
  var rows=[['التاريخ','اليوم','الماكينة','الوردية','النساج','المساعد الأول','المساعد الثاني','الإنتاج','سبب العطلة / ملاحظات','سبب العطلة (قائمة موحدة)','مدة التوقف (دقيقة)']];
  list.forEach(function(v){ rows.push([v.date,dayName(v.date),v.machine,v.shift,v.weaver||'',v.a1||'',v.a2||'',v.output==null?'':v.output,v.note||'',v.reason||'',v.dt||0]) });
  var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  dl.save({filename:'تسجيلات-جديدة-'+(new Date().toISOString().slice(0,10))+'.csv',data:new Blob([csv],{type:'text/csv;charset=utf-8'})}).then(function(){setMsg('اتنزل','ok')},function(er){ if(!er||er.code!=='declined') setMsg('معرفتش أنزل الملف','err') });
});

// shared database
function setSync(t){ $('sync').textContent=t; }
if(window.claude&&claude.use){
  var timer=setTimeout(function(){ if(!dbc) setSync('قاعدة البيانات مش متاحة، العرض من سجل الإكسل'); },10000);
  Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]).then(function(r){
    clearTimeout(timer); dbc=r[0]; var u=r[1]; dl=r[2]; if(dl) $('exp').hidden=false;
    if(!dbc){ setSync('العرض فقط، سجّل دخول للتسجيل'); return; }
    var cw=null; try{ cw=u&&u.can?u.can('data.write'):null }catch(e){}
    canWrite=(cw!==false);
    setSync(canWrite?'متصل، التسجيل مفعّل':'متصل، العرض فقط');
    dbc.collection('entries').onSnapshot(function(snap){
      over=new Map(); snap.docs.forEach(function(d){ over.set(d.id,d.data()) });
      merged=rebuild(); render(); if($('f-date').value) { if(!busy) fill(); }
    },function(){ setSync('انقطع الاتصال بقاعدة البيانات'); });
  });
} else setSync('العرض فقط');
})();
</script>

</body></html>
