name: apply-entries

on:
  push:
    paths:
      - 'entries/pending/**'
  workflow_dispatch:

permissions:
  contents: write

# تسجيل واحد بس يتنفذ في كل مرة عشان ماحدش يكتب فوق التاني
concurrency:
  group: apply-entries
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml
      - name: Apply pending entries to production.xlsx
        run: |
          if ls entries/pending/*.json >/dev/null 2>&1; then
            python scripts/append_entries.py production.xlsx entries/pending
          else
            echo "no pending entries"
          fi
      - name: Commit
        run: |
          git config user.name "entries-bot"
          git config user.email "entries-bot@users.noreply.github.com"
          git add -A production.xlsx entries
          git diff --cached --quiet && exit 0
          git commit -m "apply production entries"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i*3))
          done
          exit 1
